# Managed entries below are owned by bench-quality-cli (init/update). Do not edit by hand.
# bench-quality-cli:managed-entries commit-msg.commands.commitlint,pre-commit.commands.markdown-links,pre-commit.commands.whitespace,pre-commit.scripts.i18n-guards,pre-commit.scripts.docs-consistency,pre-commit.scripts.ci-platforms,pre-commit.scripts.workflow-hygiene,pre-commit.scripts.rust-cfg-hygiene,pre-commit.scripts.rust-crates
min_version: 1.6.0
colors: true
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
      fail_text: Commit message failed conventional-commits lint
pre-commit:
  commands:
    prettier:
      glob: "*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,scss,ts,tsx,yaml,yml}"
      exclude:
        - CHANGELOG.md
        - .release-please-manifest.json
        - src-tauri/tauri.conf.json
        - pnpm-lock.yaml
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    node-syntax:
      glob:
        - scripts/**/*.{js,mjs,cjs}
        - "*.config.{js,mjs,cjs}"
        - postcss.config.js
      run: node --check {staged_files}
    shell-syntax:
      glob: "*.sh"
      run: sh -n {staged_files}
    husky-shell:
      glob: .husky/*
      run: sh -n {staged_files}
    markdown-links:
      root: git
      run: pnpm exec markdown-link-check --config .markdown-link-check.json --quiet {staged_files}
    rust-fmt:
      glob: src-tauri/**/*.rs
      run: cargo fmt --manifest-path src-tauri/Cargo.toml -- {staged_files}
      stage_fixed: true
    whitespace:
      stage_fixed: true
      run: node scripts/quality/fix-staged-whitespace.mjs
  scripts:
    docs-consistency:
      runner: node scripts/quality/check-docs-consistency.mjs
      only:
        - docs/**
        - src/features/**
        - extensions/**
        - AGENTS.md
        - README.md
    ci-platforms:
      runner: node scripts/quality/check-ci-platforms.mjs
      only:
        - .github/workflows/**
    workflow-hygiene:
      runner: node scripts/quality/check-workflow-hygiene.mjs
      only:
        - .github/workflows/**
    frontend:
      runner: pnpm run lint:fe && pnpm run test:fe && pnpm run build:fe
      only:
        - src/**
        - public/**
        - scripts/quality/**
        - index.html
        - splash.html
        - components.json
        - postcss.config.*
        - tailwind.config.*
        - vite.config.*
        - tsconfig*.json
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    backend:
      runner: pnpm run check:be && pnpm run clippy:be && pnpm run test:be
      only:
        - src-tauri/**
    i18n-guards:
      runner: node scripts/quality/check-i18n-guards.mjs
      only:
        - src/**
        - extensions/**
    rust-cfg-hygiene:
      runner: node scripts/quality/check-rust-cfg-hygiene.mjs --fix
      stage_fixed: true
      only:
        - src-tauri/**/*.rs
    rust-crates:
      runner: node scripts/quality/check-rust-crates.mjs
      only:
        - src-tauri/**/*.rs
