name: CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    # T31: 每个 PR 都必须产生 required context（CI OK (aggregate)）。
    # 此前 docs-only PR 因 paths-ignore 完全不触发 workflow，而 Ruleset 又要求
    # 该 context，会造成 PR 永久等待；fail-closed 的聚合门禁不能依赖
    # "workflow 未运行"这种缺失信号。
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run: build & verify artifacts without touching GitHub Releases"
        type: boolean
        required: false
        default: true
      tag_name:
        description: "Tag context for dry-run aggregation (optional, e.g. v2.0.0-rc.1)"
        type: string
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  # Default to installable ad-hoc/unsigned OS packages. Set the repository
  # variable to "signed" after Apple/Windows certificates are available.
  BENCH_OS_SIGNING_MODE: ${{ vars.BENCH_OS_SIGNING_MODE || 'unsigned' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

# PR/main 迭代时取消同 ref 的旧 run，避免排队浪费双平台 runner 分钟数；
# tag push（正式发布链路）不取消，防止发布构建被误中断。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # D-026：原 verify 单 job 串行拆分为 guards / frontend / rust 三条并行流水线，
  # 墙钟 = max(三条) 而非相加。Rust 三步（clippy → test → build 冒烟）共享同一
  # 编译缓存，必须留在同一 job 内串行，不可再拆。
  guards:
    name: Guards (static)
    # 静态守卫组：零编译、分钟级，先绿先给信号。
    # 格式类检查（D-025）只警告不阻断；其余失败阻断 ci-ok。
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          # standalone：直接下载 @pnpm/exe@12.4.2 单二进制。非 standalone 在 Windows
          # 经 npm self-installer 落地 11.7.0 再被 packageManager 自切 12.4.2，
          # CMD shim 指向不存在的 global/v11 路径，`pnpm store path`（setup-node
          # cache）即断链（run 575 实测）。
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # cargo fmt --check 只需 rustfmt 组件，不编译依赖，无需 rust-cache。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch pinned; bump manually on toolchain update)
        with:
          # Exact toolchain: the only version this workspace is verified against.
          toolchain: 1.98.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # T28：格式漂移现在阻塞 CI（收进 ci-ok 聚合的 required check）。
      # main 已零漂移，且 pre-commit 对 staged 文件自动修复入库；让格式成为
      # 门禁可杜绝绕过 hooks 的提交与 bot PR 引入漂移。D-025 的非阻塞分级已撤销。
      - name: Check repository formatting
        run: pnpm run format:check

      - name: Run frontend static guards
        run: pnpm run lint:fe

      - name: Check Rust crate declarations
        run: node scripts/quality/check-rust-crates.mjs

      # T28：Rust 格式同样阻塞 CI。
      - name: Check Rust formatting
        run: pnpm run format:be

  # DEP-01：最低支持运行时（24.15.0）的兼容验证。主 CI 固定 26.8.2，
  # 这里只证明最低版本线仍可安装并跑通静态门禁 + 前端测试/构建。
  node-compat:
    name: Node 24.15 compatibility
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          # standalone：直接下载 @pnpm/exe@12.4.2 单二进制。非 standalone 在 Windows
          # 经 npm self-installer 落地 11.7.0 再被 packageManager 自切 12.4.2，
          # CMD shim 指向不存在的 global/v11 路径，`pnpm store path`（setup-node
          # cache）即断链（run 575 实测）。
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 最低支持线：engines.node >=24.15.0 的实测下限。
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend static guards
        run: pnpm run lint:fe

      - name: Frontend tests
        run: pnpm run test:fe

      - name: Frontend build
        run: pnpm run build:fe

  frontend:
    name: Frontend (test + build)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          # standalone：直接下载 @pnpm/exe@12.4.2 单二进制。非 standalone 在 Windows
          # 经 npm self-installer 落地 11.7.0 再被 packageManager 自切 12.4.2，
          # CMD shim 指向不存在的 global/v11 路径，`pnpm store path`（setup-node
          # cache）即断链（run 575 实测）。
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm run test:fe

      - name: Type-checking and building frontend
        run: pnpm run build:fe

  # Rust 编译链（双平台）：clippy → test → build 冒烟串行共享 target 缓存
  # （重定位到 ../../tauri-app-target，见 D-021）。
  # P3.2: Windows 双平台门禁回归 —— 只跑 build + clippy + test，
  # 不产出安装包（Windows 安装包恢复属 P6，见 release-build 注释）。
  # D-021 结论继续适用：sccache wrapper 是 shell 脚本，Windows 下无法作为
  # rustc-wrapper 执行，CI 一律 RUSTC_WRAPPER="" 关闭。
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    # 卡死的构建/测试最多烧 75 分钟 runner，而不是默认 6 小时上限。
    timeout-minutes: 75
    defaults:
      run:
        # windows-latest 自带 Git Bash；统一 shell 避免 pwsh/bash 差异。
        shell: bash
    env:
      # Bypass the sccache rustc-wrapper: macos-latest (arm64) runners ship
      # sccache and the wrapper can break `cargo metadata`. CI never relied
      # on sccache — keep it off for deterministic runs (see D-021).
      RUSTC_WRAPPER: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          # standalone：直接下载 @pnpm/exe@12.4.2 单二进制。非 standalone 在 Windows
          # 经 npm self-installer 落地 11.7.0 再被 packageManager 自切 12.4.2，
          # CMD shim 指向不存在的 global/v11 路径，`pnpm store path`（setup-node
          # cache）即断链（run 575 实测）。
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch pinned; bump manually on toolchain update)
        with:
          # Exact toolchain: the only version this workspace is verified against.
          toolchain: 1.98.1

      # D-027：测试运行器 cargo-nextest（进程级并行 + retries 治 flaky），
      # 与本地 `pnpm run test:be` 同源（src-tauri/.config/nextest.toml）。
      - name: Install cargo-nextest
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-nextest@0.9.144

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # D-021: target dir is relocated to <repo>/../tauri-app-target
          # (resolved relative to src-tauri/), so point the cache there
          # instead of the default ./src-tauri/target which no longer exists.
          workspaces: |
            ./src-tauri -> ../../tauri-app-target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Catches platform-gated dead code (unused_imports / dead_code / unused_mut)
      # before release builds compile it under -D warnings. P3.2 起双平台都跑：
      # 静态求解之外再以双平台真实编译兜底（roadmap P3.2 验收项）。
      - name: Check Rust cfg hygiene
        run: node scripts/quality/check-rust-cfg-hygiene.mjs

      # externalBin 校验发生在 tauri-build 的 build.rs（clippy/test 也会触发），
      # 而 sidecar 产物不进 git（.gitignore: src-tauri/binaries/）。clippy/test
      # 阶段放一个占位文件让 build.rs 通过；真实 sidecar 由 build 冒烟阶段的
      # beforeBuildCommand（build:bench-host）生成，release-build job 走完整
      # tauri build 同理。
      - name: Stub sidecar binary for clippy/test
        run: node scripts/ci/stub-sidecar.mjs

      - name: Run Rust clippy
        run: pnpm run clippy:be

      - name: Run Rust tests
        run: pnpm run test:be

      # 先清掉占位文件：build:bench-host 的 up-to-date 检查只比 mtime，
      # 占位文件比 bench-host 源码新时会误跳过真实 release 构建。
      - name: Remove sidecar stub before build smoke test
        run: node scripts/ci/stub-sidecar.mjs --clean

      - name: Run Tauri build smoke test (no bundle)
        run: pnpm tauri build --debug --no-bundle

  release-build:
    name: Release Build (${{ matrix.target }})
    # 正式 tag 或手动 dry-run dispatch 都会产出三目标构建 (A3-1)。
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: ci-ok
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
        # Windows release target 恢复属 P6（P3.2 只恢复 verify 双平台，
        # 仍不产出安装包 —— D-023：插件化能力未双平台复验前不随正式包发布）。
        # Re-add the entry below when Windows release builds are re-introduced (P6):
        #   - target: x86_64-pc-windows-msvc
        #     os: windows-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Same as `verify`: keep the sccache wrapper off in CI (see D-021).
      RUSTC_WRAPPER: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          # standalone：直接下载 @pnpm/exe@12.4.2 单二进制。非 standalone 在 Windows
          # 经 npm self-installer 落地 11.7.0 再被 packageManager 自切 12.4.2，
          # CMD shim 指向不存在的 global/v11 路径，`pnpm store path`（setup-node
          # cache）即断链（run 575 实测）。
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch pinned; bump manually on toolchain update)
        with:
          # T24：toolchain 必须精确指定。省略时 action 只把 target 装到浮动的
          # `stable-<host>` 上，而 cargo 走 rust-toolchain.toml 的 1.98.1，两者是
          # 不同的 rustup toolchain → 构建时报 `can't find crate for std`。
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      # 发布前把「实际使用的 toolchain 与已安装 target」打进日志：上面两个名字
      # 不匹配时构建会以晦涩的 std 缺失失败，这一步让故障在 30 秒内可诊断。
      - name: Verify release target is installed
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          rustc --version
          rustup target list --installed
          rustup target list --installed | grep -Fx "$RELEASE_TARGET"

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # D-021: target dir is relocated to <repo>/../tauri-app-target
          # (resolved relative to src-tauri/), so point the cache there
          # instead of the default ./src-tauri/target which no longer exists.
          workspaces: |
            ./src-tauri -> ../../tauri-app-target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release signing mode
        shell: bash
        run: |
          case "$BENCH_OS_SIGNING_MODE" in
            unsigned|signed) ;;
            *)
              echo "::error::BENCH_OS_SIGNING_MODE must be 'unsigned' or 'signed', got '$BENCH_OS_SIGNING_MODE'."
              exit 1
              ;;
          esac

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS' && env.BENCH_OS_SIGNING_MODE == 'signed'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD are required for macOS releases."
            exit 1
          fi
          keychain_path="$RUNNER_TEMP/bench-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate_path="$RUNNER_TEMP/bench-release.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          echo "BENCH_RELEASE_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      # externalBin 要求每个构建目标都有对应 triple 的 sidecar（Tauri 官方
      # 约定；交叉编译 x86_64-apple-darwin 时 host 版本不满足校验）。在
      # Build Tauri app 之前为 matrix.target 显式预构建，bench-host 为纯
      # Rust 依赖，交叉编译无 C 工具链障碍。
      - name: Build bench-host sidecar for target
        run: node scripts/plugins/build-bench-host.mjs --target ${{ matrix.target }}

      - name: Build Tauri app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for release tags."
            exit 1
          fi
          # Windows release temporarily disabled (D-021); only macOS runs here.
          if [ "$BENCH_OS_SIGNING_MODE" = "signed" ]; then
            apple_signing_identity="${{ secrets.APPLE_SIGNING_IDENTITY }}"
            apple_id="${{ secrets.APPLE_ID }}"
            apple_password="${{ secrets.APPLE_PASSWORD }}"
            apple_team_id="${{ secrets.APPLE_TEAM_ID }}"
            if [ -z "$apple_signing_identity" ] || [ -z "$apple_id" ] || [ -z "$apple_password" ] || [ -z "$apple_team_id" ]; then
              echo "::error::APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID are required in signed mode."
              exit 1
            fi
            release_config="{\"bundle\":{\"macOS\":{\"signingIdentity\":\"$apple_signing_identity\"}}}"
            pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg --config "$release_config"
          else
            echo "::warning::Building an ad-hoc signed macOS package. Users must explicitly trust Bench in macOS."
            # Do not inject empty APPLE_SIGNING_IDENTITY — it overrides tauri.conf.json ad-hoc "-".
            release_config='{"bundle":{"macOS":{"signingIdentity":"-"}}}'
            pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg --config "$release_config"
          fi

      - name: Verify macOS code signing and notarization
        if: runner.os == 'macOS' && env.BENCH_OS_SIGNING_MODE == 'signed'
        run: |
          # D-021: target dir is relocated outside the repo; resolve it
          # authoritatively instead of hardcoding src-tauri/target.
          # CWD must be src-tauri so .cargo/config.toml is picked up
          # (cargo config discovery walks up from the working directory).
          target_root="$(cd src-tauri && cargo metadata --format-version 1 --no-deps | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).target_directory)')"
          bundle_dir="$target_root/${{ matrix.target }}/release/bundle"
          app_count="$(find "$bundle_dir/macos" -maxdepth 1 -type d -name "*.app" | wc -l | tr -d ' ')"
          dmg_count="$(find "$bundle_dir/dmg" -maxdepth 1 -type f -name "*.dmg" | wc -l | tr -d ' ')"
          if [ "$app_count" -ne 1 ] || [ "$dmg_count" -ne 1 ]; then
            echo "::error::Expected one signed app and one notarized DMG for ${{ matrix.target }}."
            exit 1
          fi
          app_path="$(find "$bundle_dir/macos" -maxdepth 1 -type d -name "*.app" -print -quit)"
          dmg_path="$(find "$bundle_dir/dmg" -maxdepth 1 -type f -name "*.dmg" -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg_path"

      - name: Collect macOS bundle and updater artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) updater_platform="darwin-aarch64" ;;
            x86_64-apple-darwin) updater_platform="darwin-x86_64" ;;
            *) echo "Unsupported macOS updater target: ${{ matrix.target }}" && exit 1 ;;
          esac
          # D-021: target dir is relocated outside the repo; resolve it
          # authoritatively instead of hardcoding src-tauri/target.
          # CWD must be src-tauri so .cargo/config.toml is picked up
          # (cargo config discovery walks up from the working directory).
          target_root="$(cd src-tauri && cargo metadata --format-version 1 --no-deps | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).target_directory)')"
          bundle_dir="$target_root/${{ matrix.target }}/release/bundle"
          dmg_count="$(find "$bundle_dir/dmg" -maxdepth 1 -type f -name "*.dmg" | wc -l | tr -d ' ')"
          updater_count="$(find "$bundle_dir" -type f -name "*.app.tar.gz" | wc -l | tr -d ' ')"
          if [ "$dmg_count" -ne 1 ] || [ "$updater_count" -ne 1 ]; then
            echo "::error::Expected exactly one DMG and one updater bundle for ${{ matrix.target }}; found DMG=$dmg_count updater=$updater_count."
            exit 1
          fi
          dmg_file="$(find "$bundle_dir/dmg" -maxdepth 1 -type f -name "*.dmg" -print -quit)"
          updater_file="$(find "$bundle_dir" -type f -name "*.app.tar.gz" -print -quit)"
          if [ ! -s "$dmg_file" ] || [ ! -s "$updater_file" ] || [ ! -s "${updater_file}.sig" ]; then
            echo "::error::macOS installer, updater, or updater signature is missing/empty for ${{ matrix.target }}."
            exit 1
          fi
          cp "$dmg_file" "artifacts/${updater_platform}-$(basename "$dmg_file")"
          updater_name="${updater_platform}-$(basename "$updater_file")"
          updater_sig_name="${updater_name}.sig"
          cp "$updater_file" "artifacts/$updater_name"
          cp "${updater_file}.sig" "artifacts/$updater_sig_name"
          node scripts/release/write-updater-manifest.mjs \
            --output-dir artifacts \
            --target "${{ matrix.target }}" \
            --platform "$updater_platform" \
            --file "artifacts/$updater_name" \
            --signature "artifacts/$updater_sig_name"

      # Windows artifact collection temporarily disabled (D-021).
      # Re-add a step that runs only `if: runner.os == 'Windows'` and produces
      # `windows-x86_64-*.msi` / `windows-x86_64-*.exe(.sig)` when Windows CI
      # is re-introduced.

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary Apple release keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${BENCH_RELEASE_KEYCHAIN:-}" ]; then
            security delete-keychain "$BENCH_RELEASE_KEYCHAIN"
          fi

  publish:
    name: Publish Release
    # 正式 tag 推送, 或携带 tag_name 的手动 dispatch (聚合 dry-run 产物) (A3-1)。
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    needs: release-build
    runs-on: macos-latest
    timeout-minutes: 40
    # D-025 权限收窄：publish 是唯一需要写权限的 job（gh release create/upload）。
    permissions:
      contents: write
      actions: read

    env:
      PUBLISH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      # Same as `verify`: keep the sccache wrapper off in CI (see D-021).
      RUSTC_WRAPPER: ""
      # D-021: Windows release builds are temporarily disabled, so the
      # windows-x86_64 installers/updater assets do not exist here. Relax
      # the corresponding requirements in verify-release-assets.mjs /
      # generate-updater-json.mjs until Windows CI is re-introduced.
      BENCH_RELEASE_WINDOWS_DISABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve publish mode (final tag vs dry-run)
        shell: bash
        # 不可信上下文（inputs/event）只经 env 传入 shell，不做 run 内插值（防模板注入）。
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          event="$EVENT_NAME"
          tag_name="$PUBLISH_TAG"
          dry_run_input="$DRY_RUN_INPUT"

          if [[ "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            final_tag="true"
          else
            final_tag="false"
          fi

          if [[ "$event" == "workflow_dispatch" ]]; then
            dry_run="${dry_run_input:-true}"
          else
            # tag push: RC/预发布 tag 一律 dry-run, 不得产生 Release 副作用 (A3-1)。
            if [[ "$final_tag" == "true" ]]; then dry_run="false"; else dry_run="true"; fi
          fi

          # 正式发布 (dry_run=false) 只允许无预发布后缀的正式 tag + R10 人工批准。
          if [[ "$dry_run" != "true" && "$final_tag" != "true" ]]; then
            echo "::error::Release side effects require a final vX.Y.Z tag (got '$tag_name')."
            exit 1
          fi

          {
            echo "DRY_RUN=$dry_run"
            echo "FINAL_TAG=$final_tag"
            echo "TAG_NAME=$tag_name"
          } >> "$GITHUB_ENV"
          echo "publish mode: tag=$tag_name final=$final_tag dry_run=$dry_run"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch pinned; bump manually on toolchain update)
        with:
          # Exact toolchain: the only version this workspace is verified against.
          toolchain: 1.98.1

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # D-021: target dir is relocated to <repo>/../tauri-app-target
          # (resolved relative to src-tauri/), so point the cache there
          # instead of the default ./src-tauri/target which no longer exists.
          workspaces: |
            ./src-tauri -> ../../tauri-app-target

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Write OS signing notice
        shell: bash
        run: |
          case "$BENCH_OS_SIGNING_MODE" in
            unsigned)
              cat > release-assets/OS-SIGNING-NOTICE.txt <<'EOF'
          Bench packages in this release are not signed with Apple Developer ID or Windows Authenticode.

          macOS uses an ad-hoc signature. Open Bench with Control-click > Open, or allow it from
          System Settings > Privacy & Security after confirming the SHA256SUMS checksum.

          Windows may display an unknown publisher warning. Confirm the release source and
          SHA256SUMS checksum before continuing.

          Application updater bundles remain signed with the separate Tauri updater key.
          EOF
              ;;
            signed)
              printf '%s\n' 'Bench packages in this release use OS code signing and a separate Tauri updater signature.' > release-assets/OS-SIGNING-NOTICE.txt
              ;;
            *)
              echo "::error::Unsupported BENCH_OS_SIGNING_MODE: $BENCH_OS_SIGNING_MODE"
              exit 1
              ;;
          esac

      - name: List release assets
        run: ls -la release-assets/

      - name: Verify required release assets
        run: node scripts/release/verify-release-assets.mjs release-assets

      - name: Read release metadata without mutating GitHub
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release view "$TAG_NAME" --json body,publishedAt > release-metadata.json
          else
            # dry-run 用合成 tag（例如 v1.35.1-verify），检出不里没有这个 ref：退回 HEAD 的
            # 提交时间。预检（校验资产/签名/生成 latest.json）不应因为一个不存在的 tag 失败，
            # 也不该因此制造任何 GitHub 变更。
            published_at="$(git show -s --format=%cI "$TAG_NAME" 2>/dev/null || git show -s --format=%cI HEAD)"
            jq -n --arg publishedAt "$published_at" '{body: "", publishedAt: $publishedAt}' > release-metadata.json
          fi

      - name: Generate latest.json
        run: node scripts/release/generate-updater-json.mjs --assets-dir release-assets --tag "$TAG_NAME" --repo "${{ github.repository }}" --release-metadata release-metadata.json

      # cargo run 会触发 tauri-build 的 build.rs externalBin 校验；本 job
      # 不执行 tauri build（sidecar 真实产物留在 release-build job），这里
      # 只需占位文件让 build.rs 通过。
      - name: Stub sidecar binary for cargo run
        run: node scripts/ci/stub-sidecar.mjs

      - name: Verify updater signatures
        run: |
          updater_pubkey="$(node -e "const fs=require('fs'); const conf=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); process.stdout.write(conf.plugins.updater.pubkey);")"
          cargo run --manifest-path src-tauri/Cargo.toml --bin verify_updater_manifest -- \
            --latest-json release-assets/latest.json \
            --assets-dir release-assets \
            --pubkey "$updater_pubkey"

      - name: Build SHA256SUMS
        run: |
          shopt -s nullglob
          rm -f release-assets/updater-manifest-*.json
          (
            cd release-assets
            for file in *; do
              if [ -f "$file" ] && [ "$file" != "SHA256SUMS" ]; then
                shasum -a 256 "$file"
              fi
            done > SHA256SUMS
            test -s SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )

      # 显式 guard: 只有正式 tag 且非 dry-run 才允许 Release 副作用 (A3-1)。
      # T30: guard 只在正式发布模式运行 —— dry-run 的成功语义就是
      # “预检全部通过且无副作用”，拒绝写入不能实现成整条流水线失败。
      - name: Publish guard
        if: env.DRY_RUN == 'false'
        run: |
          if [[ "$FINAL_TAG" != "true" ]]; then
            echo "::error::Refusing to publish: tag '$TAG_NAME' is not a final vX.Y.Z tag."
            exit 1
          fi

      - name: Create or update GitHub Release
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" \
              --title "Bench $TAG_NAME" \
              --generate-notes \
              release-assets/*
          fi

      - name: Mark successful dry-run
        if: env.DRY_RUN == 'true'
        run: |
          echo "DRY-RUN verification passed; no Release mutation was attempted." >> "$GITHUB_STEP_SUMMARY"
          echo "### DRY-RUN: 未创建/更新 GitHub Release" >> "$GITHUB_STEP_SUMMARY"
          echo "产物以 CI artifact 形式上传 (bundle-*), latest.json 与签名校验均在 dry-run 下完成。" >> "$GITHUB_STEP_SUMMARY"

  # T27.1：关键浏览器 E2E 上 CI —— 单元测试证明状态函数，浏览器测试证明
  # i18n 切换、焦点副作用、响应式布局与用户可见错误在组合后仍成立。
  # 只跑 viewport-1280 单 project 的 17 项关键流（Ubuntu + Chromium，成本可控）；
  # 完整 5-project 矩阵留给本地/定时任务。失败即 ci-ok 红，并有 artifact 可查。
  e2e-critical:
    name: E2E (critical, ubuntu chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (with deps)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run critical E2E (viewport-1280)
        run: pnpm exec playwright test --project=viewport-1280

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # D-025：branch protection 只需把本 job 设为 required check，
  # 不用分别盯 matrix 里两个会漂移的 "Verify (os)" 条目。
  ci-ok:
    name: CI OK (aggregate)
    needs: [guards, node-compat, frontend, rust, e2e-critical]
    if: always()
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      # T31: fail-closed —— 四条必需流水线必须逐一 success 才放行。
      # 只检查 failure/cancelled 会放过 skipped：任何一条意外 skipped 时
      # "All passed" 仍会执行，聚合结果失真。
      - name: Fail unless every required pipeline succeeded
        if: >-
          needs.guards.result != 'success' ||
          needs.node-compat.result != 'success' ||
          needs.frontend.result != 'success' ||
          needs.rust.result != 'success' ||
          needs.e2e-critical.result != 'success'
        run: |
          echo "::error::质量门禁流水线未全绿: ${{ toJSON(needs.*.result) }}"
          exit 1

      - name: All gate pipelines passed
        if: >-
          needs.guards.result == 'success' &&
          needs.node-compat.result == 'success' &&
          needs.frontend.result == 'success' &&
          needs.rust.result == 'success' &&
          needs.e2e-critical.result == 'success'
        run: echo "guards / node-compat / frontend / rust 全绿。"
