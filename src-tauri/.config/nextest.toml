# cargo-nextest 配置：本地与 CI 共用同一 profile（同源原则，见 decisions.md D-027）。
# nextest 的 workspace root 是 src-tauri/（Cargo.toml 所在目录），
# 故本文件位于 src-tauri/.config/nextest.toml 而非仓库根。

[profile.default]
# 失败重试 1 次：两次都挂才判定失败，容忍偶发 flaky（本地与 CI 行为一致）。
retries = 1
# 单测 120s 未结束标记为 slow 并告警；240s（2 倍周期）强杀，
# 防止单个挂死测试占满 runner（配合 ci-build.yml 的 timeout-minutes: 75）。
slow-timeout = { period = "120s", terminate-after = 2 }
