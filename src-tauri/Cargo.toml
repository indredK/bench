[workspace]
# bench-capabilities：平台无关能力内核（src-tauri 与 bench-host 共享，单一事实来源）；
# bench-host：协议出口二进制（Native Messaging / MCP / CLI），随应用作为 sidecar 打包。
members = [".", "crates/bench-capabilities", "crates/bench-host"]

[workspace.package]
version = "1.33.0"

[package]
name = "bench"
version.workspace = true
edition = "2021"
license = "MIT"
default-run = "bench"

[lib]
name = "bench_lib"
# 桌面端只需 rlib（bin target 直接链接它）。cdylib/staticlib 是 Tauri 移动端模板
# 的产物要求，本地 debug 会额外生成一份 456 MB 的 libbench_lib.a 且每次链接都要
# 处理它；release 下更糟——每个 crate-type 都要单独走一遍 codegen + LTO，
# 是 CI 发布构建里 `bench` crate 阶段耗时的主因之一（详见 D-021 相关调研）。
# 若将来启用 `tauri android init` / `tauri ios init`，把 staticlib,cdylib 加回来即可。
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bench-capabilities = { path = "crates/bench-capabilities", version = "0.1.0" }
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "macos-proxy", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
walkdir = "2"
chrono = "0.4"
cookie = "0.18"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
# CDP（Chrome DevTools Protocol）WebSocket 客户端：浏览器会话注入 / 回采（browser_session）。
# 仅连接本机 loopback `ws://127.0.0.1:<port>`，无需 TLS，故关掉默认 TLS 相关特性。
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
] }
base64 = "0.22"
minisign-verify = "0.2.5"
plist = "1.10"
async-trait = "0.1"
quick-xml = { version = "0.41", features = ["serialize"] }
serde_yaml = "0.9"
semver = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "stream", "socks", "query", "json"] }
sha2 = "0.11"
md5 = "0.8"
sha1 = "0.11"
ed25519-dalek = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
futures-util = "0.3"
rand = "0.10"
aes-gcm = "0.11"
keyring = "4"
uuid = { version = "1", features = ["v4"] }
url = "2"
zeroize = "1"
if-addrs = "0.14"
surge-ping = "0.9.0"
hickory-resolver = "0.26.1"
trippy-core = "0.13.0"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2.10.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
window-vibrancy = "0.6"
# 禁用 WKWebView 原生橡皮筋（overscroll bounce）时需要，版本与 Tauri 2.11.5 内部一致，
# 精确锁定避免依赖树出现第二个 objc2 副本导致类型/链接冲突。
# disable-encoding-assertions：objc2 0.6 的 msg_send! 在 debug 构建下会严格校验
# 选择器编码。我们用 msg_send! 直接发 WKWebView 的 `scrollView`/`setBounces:` 等
# objc2-web-kit 0.3.2 未生成的运行时选择器，其返回声明为裸指针 `*mut AnyObject`
# （编码为 ^），而方法实际返回对象（编码 @），debug 校验会误判 panic 并因处于
# ObjC 回调中无法 unwind 而 abort。该方法是 ABI 兼容的，仅校验误报，故关闭校验。
objc2 = { version = "=0.6.4", features = ["disable-encoding-assertions"] }
objc2-app-kit = "=0.3.2"
objc2-web-kit = "=0.3.2"
# 遍历 webview 子视图树所需（NSArray<NSView> 的正确编码，避免裸指针编码校验 panic）。
objc2-foundation = "=0.3.2"

[profile.dev]
# 限制 target 目录体积：默认 dev profile 对每个 crate 都带全量 debuginfo，
# 是 debug 构建目录膨胀（数十 GB）的首要原因。line-tables-only 保留
# 行号表（panic backtrace 仍然可用），debuginfo 体积大幅缩小且增量编译
# 更快（Rust perf-team 推荐）。
debug = "line-tables-only"

# 依赖包不生成调试信息：deps/ 目录 4.5G 的主要构成是第三方 crate 的
# rlib/rmeta debuginfo（objc2-app-kit 单个 rlib 即 151M + rmeta 111M）。
# 关闭后依赖产物体积大幅下降，链接更省内存；**自己代码的调试能力不受影响**
# （上面 [profile.dev] 仍保留 line-tables-only，断点与栈回溯正常）。
# 代价：无法在依赖库内部下断点，依赖帧的栈回溯无行号；改动会触发一次全量重编译。
# 回滚：删除本段落 + 重新 `cargo build` 即可。
# 详见 docs/explanation/rust-build-cache-optimization-research.md 方案 A。
[profile.dev.package."*"]
debug = false

[profile.release]
panic = "abort"
codegen-units = 16
lto = true
opt-level = "s"
strip = true
